name: App Store Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "출시 버전 (예: 1.0.0)"
        required: true
        type: string
      release_notes:
        description: "이번 버전 변경사항 (비워두면 metadata/ko/release_notes.txt 사용)"
        required: false
        type: string

concurrency:
  group: appstore-release
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────
  # Validate (메타데이터·버전 사전 검증 — 빌드 전에 실패시킨다)
  # ──────────────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # 태그 실행이면 태그명(v1.0.0)에서, 수동 실행이면 입력값에서 버전을 확정한다
      - name: Resolve version
        id: resolve
        # 입력값은 셸에 직접 보간하지 않고 env 로 넘긴다 (스크립트 인젝션 방지)
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::버전 형식이 올바르지 않습니다: $VERSION (예: 1.0.0)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "🚀 배포 버전: $VERSION"

      - name: Setup Ruby & fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Verify metadata
        # 심사 담당자 연락처는 개인정보라 저장소에 두지 않고 Secrets 에서 주입한다
        env:
          APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
          APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
          APP_REVIEW_PHONE_NUMBER: ${{ secrets.APP_REVIEW_PHONE_NUMBER }}
          APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
        run: bundle exec fastlane verify_metadata

  # ──────────────────────────────────────────────────────────
  # Release (빌드 → 메타데이터 업로드 → 심사 제출)
  # ──────────────────────────────────────────────────────────
  release:
    needs: validate
    runs-on: macos-15
    # 서명 단계가 매달려도 러너를 오래 점유하지 않도록 상한을 둔다
    # (concurrency 가 cancel-in-progress: false 라 멈춘 잡이 후속 배포를 전부 막는다)
    timeout-minutes: 90
    env:
      # Appfile / Fastfile
      APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      # match
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
      # 러너에 이미 있는 login 키체인은 비밀번호를 알 수 없어 match 의 set-key-partition-list 가 실패한다
      # → 전용 키체인을 새로 만들어 쓴다 (Matchfile 이 이 값을 참조)
      MATCH_KEYCHAIN_NAME: build.keychain
      # 인증서 repo(private) 클론용 토큰 — Release 스텝에서 MATCH_GIT_BASIC_AUTHORIZATION 로 인코딩
      CONFIG_PRIVATE_REPO_TOKEN: ${{ secrets.CONFIG_PRIVATE_REPO_TOKEN }}
      # App Store Connect API (Fastfile 변수명)
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      # App Store Connect API (Matchfile 변수명 호환)
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      # deliver 가 대화형 확인을 요구하지 않도록 (CI 에서 입력 불가)
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      # App Review 담당자 연락처 (개인정보라 metadata 파일이 아닌 Secrets 로만 관리)
      APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
      APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
      APP_REVIEW_PHONE_NUMBER: ${{ secrets.APP_REVIEW_PHONE_NUMBER }}
      APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup mise & tuist
        uses: jdx/mise-action@v2

      # 커밋된 tuisttool 바이너리는 로컬 macOS 26 기준으로 빌드되어 macos-15 러너에서 로드 불가
      # → 러너 OS에 맞게 소스에서 재컴파일 (Install dependencies·fastlane 의 ./tuisttool 호출 대비)
      - name: Build tuisttool
        run: swiftc TuistTool.swift -o tuisttool

      - name: Setup Ruby & fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download private xcconfig
        run: |
          echo "GITHUB_ACCESS_TOKEN=${CONFIG_PRIVATE_REPO_TOKEN}" > .env
          make download-privates

      # 수동 실행에서 변경사항을 넘겼으면 이번 배포에 한해 릴리즈 노트를 덮어쓴다 (커밋하지 않음)
      - name: Override release notes
        if: github.event_name == 'workflow_dispatch' && inputs.release_notes != ''
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > fastlane/metadata/ko/release_notes.txt
          echo "릴리즈 노트를 입력값으로 교체했습니다."

      # 생성 실패를 무시하면 러너의 기존 키체인을 그대로 쓰게 되고, 비밀번호 불일치로
      # codesign 이 뜰 수 없는 승인 팝업을 기다리며 무한 대기한다. 실패 시 즉시 잡을 멈춘다.
      - name: Prepare keychain
        run: |
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          # xcodebuild 가 시스템 인증서를 찾을 수 있도록 login 키체인도 검색 목록에 남긴다
          security list-keychains -d user -s build.keychain login.keychain-db
          security default-keychain -s build.keychain

      # SPM 의존성 설치 (fastlane 의 ensure_workspace 가 generate 하기 전 선행)
      - name: Install dependencies
        run: ./tuisttool install

      - name: Submit to App Store
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # match 가 private 인증서 repo 를 클론할 때 사용할 basic auth 헤더 생성
          # (base64 는 긴 토큰에서 줄바꿈이 삽입되므로 제거)
          export MATCH_GIT_BASIC_AUTHORIZATION=$(printf 'x-access-token:%s' "${CONFIG_PRIVATE_REPO_TOKEN}" | base64 | tr -d '\n')
          bundle exec fastlane release version:"$RELEASE_VERSION"

      # 심사 반려·업로드 실패 원인 추적용. IPA 는 용량이 커서 로그만 남긴다
      - name: Upload fastlane logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs-${{ needs.validate.outputs.version }}
          path: |
            ~/Library/Logs/gym/
            fastlane/report.xml
          retention-days: 14
          if-no-files-found: ignore
