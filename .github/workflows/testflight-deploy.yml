name: TestFlight Deploy

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # ──────────────────────────────────────────────────────────
  # Check (배포가 필요한 변경인지 판정)
  # ──────────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          emit() {
            echo "should_deploy=$1" >> "$GITHUB_OUTPUT"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
            echo "$2"
            exit 0
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            emit true "✅ 수동 실행 — TestFlight 배포를 진행합니다."
          fi

          if [ "$MERGED" != "true" ]; then
            emit false "⏭️ 머지되지 않고 닫힌 PR 이라 배포를 건너뜁니다."
          fi

          if echo "$LABELS" | jq -e 'index("skip-testflight")' >/dev/null; then
            emit false "⏭️ \`skip-testflight\` 라벨이 붙어 있어 배포를 건너뜁니다."
          fi

          # 파일 목록 조회가 실패하면 판정 근거가 없으므로 안전한 쪽(배포)으로 떨어뜨린다
          files=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path' || true)
          if [ -z "$files" ]; then
            emit true "✅ 변경 파일 목록을 확인하지 못해 배포를 진행합니다."
          fi

          if printf '%s\n' "$files" | .github/scripts/has-app-changes.sh; then
            emit true "✅ 앱에 영향을 주는 변경이 있어 배포를 진행합니다."
          else
            emit false "⏭️ 문서·설정 파일만 변경되어 배포를 건너뜁니다."
          fi

  # ──────────────────────────────────────────────────────────
  # Deploy (TestFlight)
  # ──────────────────────────────────────────────────────────
  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: macos-15
    # 실제 배포끼리만 직렬화한다 (판정 job 까지 배포 큐 뒤에 세우지 않도록 job 레벨에 둔다)
    concurrency:
      group: testflight-deploy
      cancel-in-progress: false
    # 서명 단계가 매달려도 러너를 오래 점유하지 않도록 상한을 둔다
    # (concurrency 가 cancel-in-progress: false 라 멈춘 잡이 후속 배포를 전부 막는다)
    timeout-minutes: 60
    env:
      # Appfile / Fastfile
      APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      # match
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
      # 러너에 이미 있는 login 키체인은 비밀번호를 알 수 없어 match 의 set-key-partition-list 가 실패한다
      # → 전용 키체인을 새로 만들어 쓴다 (Matchfile 이 이 값을 참조)
      MATCH_KEYCHAIN_NAME: build.keychain
      # 인증서 repo(private) 클론용 토큰 — Deploy 스텝에서 MATCH_GIT_BASIC_AUTHORIZATION 로 인코딩
      CONFIG_PRIVATE_REPO_TOKEN: ${{ secrets.CONFIG_PRIVATE_REPO_TOKEN }}
      # App Store Connect API (Fastfile 변수명)
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      # App Store Connect API (Matchfile 변수명 호환)
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup mise & tuist
        uses: jdx/mise-action@v2

      # 커밋된 tuisttool 바이너리는 로컬 macOS 26 기준으로 빌드되어 macos-15 러너에서 로드 불가
      # → 러너 OS에 맞게 소스에서 재컴파일 (Install dependencies·fastlane 의 ./tuisttool 호출 대비)
      - name: Build tuisttool
        run: swiftc TuistTool.swift -o tuisttool

      - name: Setup Ruby & fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download private xcconfig
        run: |
          echo "GITHUB_ACCESS_TOKEN=${CONFIG_PRIVATE_REPO_TOKEN}" > .env
          make download-privates

      # 생성 실패를 무시하면 러너의 기존 키체인을 그대로 쓰게 되고, 비밀번호 불일치로
      # codesign 이 뜰 수 없는 승인 팝업을 기다리며 무한 대기한다. 실패 시 즉시 잡을 멈춘다.
      - name: Prepare keychain
        run: |
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          # xcodebuild 가 시스템 인증서를 찾을 수 있도록 login 키체인도 검색 목록에 남긴다
          security list-keychains -d user -s build.keychain login.keychain-db
          security default-keychain -s build.keychain

      # SPM 의존성 설치 (fastlane 의 ensure_workspace 가 generate 하기 전 선행)
      - name: Install dependencies
        run: ./tuisttool install

      - name: Deploy to TestFlight
        run: |
          # match 가 private 인증서 repo 를 클론할 때 사용할 basic auth 헤더 생성
          # (base64 는 긴 토큰에서 줄바꿈이 삽입되므로 제거)
          export MATCH_GIT_BASIC_AUTHORIZATION=$(printf 'x-access-token:%s' "${CONFIG_PRIVATE_REPO_TOKEN}" | base64 | tr -d '\n')
          bundle exec fastlane beta
